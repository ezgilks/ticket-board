name: CI

# Runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # A throwaway Postgres (with pgvector) just for this job's tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket
          POSTGRES_DB: ticketboard_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ticket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      TEST_DATABASE_URL: postgresql://ticket:ticket@localhost:5433/ticketboard_test
      TEST_REDIS_URL: redis://localhost:6379/1
      # prisma generate reads the config file, which needs *a* URL to exist.
      DATABASE_URL: postgresql://ticket:ticket@localhost:5433/ticketboard_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Gated at "critical": the 4 known "high" findings are in the Prisma CLI's
      # transitive deps (mysql2, deepmerge-ts), which never run in this app.
      # @prisma/client peer-depends on the CLI, so --omit=dev can't exclude them.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (includes typecheck)
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # Real-model tests are skipped here (RUN_MODEL_TESTS unset) to keep CI fast.
      - name: Test
        run: pytest -q

  # Catches a broken Dockerfile before a deploy does.
  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ticketboard-api ./api
      - run: docker build -t ticketboard-web ./web

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      # -backend=false: validate syntax and references without touching any AWS account.
      - run: terraform init -backend=false
      - run: terraform validate
