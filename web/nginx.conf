# Used by the Docker Compose "app" profile: serves the React build and proxies the API,
# so the browser sees a single origin (no CORS) — same as the Vite dev server.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000/;
  }

  location /socket.io/ {
    proxy_pass http://api:3000;
    # WebSockets start as HTTP and "upgrade"; nginx must forward these headers.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /graphql {
    proxy_pass http://api:3000;
  }

  # Client-side routing: unknown paths (e.g. /boards/123) serve index.html and React Router takes over.
  location / {
    try_files $uri /index.html;
  }
}
